<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Realtime Number</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #000;
            color: #fff;

            font-family: Arial, sans-serif;
        }

        #number {
            font-size: 250px;
            font-weight: bold;
            line-height: 1;
        }
    </style>
</head>

<body>

    <div id="number"></div>

    <script>

        const numberElement = document.getElementById("number");

        async function readData() {

            try {

                const response = await fetch("data.json?t=" + Date.now());

                const data = await response.json();

                numberElement.textContent = data.number;

            } catch (error) {

                console.error("Gagal membaca data.json:", error);

            }

        }

        // Baca pertama kali
        readData();

        // Cek data.json setiap 100ms
        setInterval(readData, 100);
    </script>

</body>

</html>
